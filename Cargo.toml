[package]
name = "musicalus"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
base64 = "0.22.1"
hex = "0.4.3"
lazy_static = "1.5.0"
li_logger = { version = "0.2.1", features = ["middleware"] }
openssl = { version = "0.10.76", features = ["vendored"] }
rand = "0.10.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["cookies", "form", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
url = "2.5.8"
